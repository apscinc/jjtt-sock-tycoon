  <style>
    :root {
      color-scheme: light;
      --navy: #294f64;
      --sky: #8fbed1;
      --cream: #f5eedc;
      --green: #315d42;
      --yellow: #f1ca62;
      --coral: #c86450;
      --ink: #17344a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #dbe8ed;
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      overscroll-behavior: none;
    }

    body {
      display: grid;
      place-items: center;
      padding: 14px;
    }

    .page {
      width: min(100%, 440px);
    }

    .game-shell {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 4px solid var(--navy);
      border-radius: 24px;
      background: var(--cream);
      box-shadow: 0 16px 48px rgba(23, 52, 74, 0.24);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 9 / 16;
      background: var(--cream);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(23, 52, 74, 0.78);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .overlay.show { display: flex; }

    .panel {
      width: 100%;
      padding: 24px 20px 20px;
      border: 3px solid var(--navy);
      border-radius: 20px;
      background: var(--cream);
      box-shadow: 0 8px 0 rgba(23, 52, 74, 0.22);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(25px, 7vw, 34px);
      line-height: 1.12;
    }

    .overlay-body {
      margin: 15px 0 18px;
      color: #415a68;
      font-size: 14px;
      line-height: 1.65;
    }

    .game-logo-lockup {
      width: 100%;
      margin: 0 auto 7px;
      text-align: center;
    }

    .game-logo-lockup.compact {
      margin-bottom: 4px;
      text-align: center;
    }

    .game-logo-lockup:not(.compact) #overlayTitle { display: none; }
    .game-logo-lockup.compact .game-title-logo { display: none; }

    .game-title-logo {
      display: block;
      width: 100%;
      max-width: 368px;
      max-height: 246px;
      margin: 0 auto;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .audio-hint {
      margin: 5px 0 2px;
      color: var(--coral);
      font-size: 13px;
      font-weight: 900;
      line-height: 1.35;
      text-align: center;
    }

    .audio-hint.playing { color: var(--green); }
    .game-logo-lockup.compact .audio-hint { display: none; }

    .panel strong { color: var(--green); }

    .best-score-line {
      display: none;
      margin: -7px 0 16px;
      padding: 10px 12px;
      border: 2px solid var(--navy);
      border-radius: 12px;
      color: var(--navy);
      background: rgba(241, 202, 98, 0.38);
      font-size: 15px;
      font-weight: 900;

    .best-score-line.show { display: block; }
    .best-score-line.new-record {

    .button-row {

    button, .shop-link {

      border-radius: 12px;

      cursor: pointer;

    button {
      color: var(--cream);
      background: var(--navy);
      box-shadow: 0 4px 0 #17344a;
    }

    button:active { transform: translateY(2px); box-shadow: 0 2px 0 #17344a; }

    .sound-toggle {

    #primaryButton { order: 3; }

    .receipt {

    .receipt-heading {
      margin-bottom: 9px;

    .receipt-row {
      display: flex;

      padding: 4px 0;

    .receipt-total {

    .receipt-thanks {

    .note {

    .sr-live {
      position: absolute;
      width: 1px;

      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);

      border: 0;
    }

    @media (max-width: 480px) {
      body { padding: 0; background: var(--navy); }
      .page { width: 100%; }
      .game-shell { border-width: 0; border-radius: 0; box-shadow: none; }
      .note { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>

<body>

    <section class="game-shell" aria-label="JJTT 양말가게 타이쿤 게임">
      <canvas id="game" width="540" height="960" aria-label="재봉, 스팀, 포장 공정을 탭해 양말을 판매하고 스케이트보드로 배달하는 게임"></canvas>

            <h1 id="overlayTitle">양말가게 타이쿤!</h1>

  <script>
    (() => {
      'use strict';

      // 실제 쇼핑몰 주소를 넣으면 결과 화면에 상품 링크가 나타납니다.
      const SHOP_URL = 'https://jacktweet.com';

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const startLogo = document.getElementById('startLogo');
      const gameTitleLogo = document.getElementById('gameTitleLogo');
      const audioHint = document.getElementById('audioHint');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayBody = document.getElementById('overlayBody');
      const bestScoreLine = document.getElementById('bestScoreLine');
      const primaryButton = document.getElementById('primaryButton');
      const restartButton = document.getElementById('restartButton');
      const soundButton = document.getElementById('soundButton');
      const pauseButton = document.getElementById('pauseButton');
      const shareButton = document.getElementById('shareButton');
      const shopLink = document.getElementById('shopLink');
      const liveRegion = document.getElementById('liveRegion');

      const ASSET_BASE = 'https://ecimg.cafe24img.com/pg2018b12298535008/encho825/game/jjtt-pixel-assets-v2/';
      const LOCAL_ASSET_BASE = 'jjtt-pixel-assets-v2/';
      const AUDIO_ASSET_BASE = 'https://apscinc.github.io/jjtt-sock-tycoon/';
      const assetFiles = {
        factoryBg: 'factory-background.png',
        villageRoute: 'village-route-panorama.png',
        gameTitleLogo: 'game-title-logo.png',
        transitionCj: 'transition-cj-sheet.png'
      };
      [
        'cj-factory-idle-a', 'cj-factory-idle-b',
        'cj-factory-sew-a', 'cj-factory-sew-b',
        'cj-factory-fix-a', 'cj-factory-fix-b',
        'cj-factory-carry-a', 'cj-factory-carry-b',
        'cj-delivery-ride-a', 'cj-delivery-ride-b',
        'cj-delivery-jump-a', 'cj-delivery-jump-b',
        'cj-delivery-wobble-a', 'cj-delivery-wobble-b',
        'cj-delivery-handoff-a', 'cj-delivery-handoff-b',
        'customer-0-wait', 'customer-1-wait', 'customer-2-wait', 'customer-3-wait',
        'customer-0-impatient', 'customer-1-impatient', 'customer-2-impatient', 'customer-3-impatient',
        'customer-0-happy', 'customer-1-happy', 'customer-2-happy', 'customer-3-happy',
        'npc-youth-wait', 'npc-fire-wait', 'npc-senior-wait',
        'npc-youth-receive', 'npc-fire-receive', 'npc-senior-receive',
        'machine-sew', 'machine-steam', 'machine-pack',
        'sock-white-eye', 'sock-booby', 'sock-kingfisher',
        'effect-thread-jam', 'effect-steam', 'display-tray',
        'obstacle-puddle', 'obstacle-cones', 'obstacle-ball', 'effect-heart',
        'feather-a', 'feather-b', 'effect-speed', 'booby-bird'
      ].forEach(name => {
        assetFiles[name] = `sprites/${name}.png`;
      });
      const pixelAssets = {};
      Object.entries(assetFiles).forEach(([key, file]) => {
        const image = new Image();
        image.onerror = () => {
          image.onerror = null;
          image.src = `${LOCAL_ASSET_BASE}${file}`;
        };
        image.src = `${ASSET_BASE}${file}`;
        pixelAssets[key] = image;
      });
      gameTitleLogo.onerror = () => {
        gameTitleLogo.onerror = null;
        gameTitleLogo.src = `${LOCAL_ASSET_BASE}${assetFiles.gameTitleLogo}`;
      };
      gameTitleLogo.src = `${ASSET_BASE}${assetFiles.gameTitleLogo}`;

      const AUDIO_FILES = {
        main: 'main-page.webm',
        stage1: 'stage1-store.webm',
        transition: 'stage-change.webm',
        stage2: 'stage2-skateboard.webm',
        fever: 'fever.webm',
        finish: 'finish.webm'
      };
      const AUDIO_VOLUMES = {
        main: 0.085,
        stage1: 0.095,
        transition: 0.11,
        stage2: 0.10,
        fever: 0.115,
        finish: 0.11
      };
      const SFX_MASTER_VOLUME = 0.90;
      const externalTracks = {};
      Object.entries(AUDIO_FILES).forEach(([name, file]) => {
        const audio = new Audio();
        const track = {
          audio,
          file,
          usingLocal: false,
          failed: false,
          targetVolume: 0
        };
        audio.preload = 'auto';
        audio.playsInline = true;
        audio.loop = ['main', 'stage1', 'stage2'].includes(name);
        audio.volume = 0;
        audio.addEventListener('error', () => {
          if (!track.usingLocal) {
            track.usingLocal = true;
            audio.src = `${LOCAL_ASSET_BASE}audio/${file}`;
            if (name === currentBgmName && externalAudioUnlocked && !audioMuted && !isPaused) safePlayExternalTrack(track);
          } else {
            track.failed = true;
          }
        });
        audio.addEventListener('ended', () => {
          if (name === 'finish' && phase === 'end') {
            finishMusicCompleted = true;
            switchExternalBgm('main', { restart: true });
          }
        });
        audio.src = `${AUDIO_ASSET_BASE}${file}`;
        externalTracks[name] = track;
      });

      const W = 540;
      const H = 960;
      const FACTORY_DURATION = 70;
      const DELIVERY_DURATION = 33;
      const TRANSITION_DURATION = 3;
      const BEST_SCORE_KEY = 'jjtt-sock-tycoon-best-v1';
      const DELIVERY_WORLD_SPEED = 119;
      const DELIVERY_WORLD_WIDTH = W * 7;
      const SEW_TIME = 5.5;
      const STEAM_TIME = 2.5;
      const PACK_TIME = 1.7;
      const JAM_CHANCE = 0.24;
      const STOCK_MAX = 9;

      const C = {
        navy: '#294f64',
        dark: '#17344a',
        sky: '#8fbed1',
        paleSky: '#cfe3ec',
        cream: '#f5eedc',
        warm: '#e9d7c1',
        green: '#315d42',
        paleGreen: '#d9e7ce',
        yellow: '#f1ca62',
        coral: '#c86450',
        paleCoral: '#efc4b8',
        white: '#fffdf6',
        floor: '#d7e3d8',
        brown: '#8b6042',
        road: '#615a58'
      };

      const stationColumns = [20, 193, 366];
      const stationRows = [360, 470, 580];
      const stationW = 154;
      const stationH = 96;
      const stockRect = { x: 20, y: 710, w: 500, h: 128 };

      const designs = [
        { name: 'WHITE-EYE', body: '#f5eedc', accent: '#315d42' },
        { name: 'BOOBY', body: '#8fbed1', accent: '#f5eedc' },
        { name: 'KINGFISHER', body: '#294f64', accent: '#f1ca62' }
      ];

      let phase = 'start';
      let lastTime = 0;
      let factory;
      let delivery;
      let transitionLeft = 0;
      let transitionScene = -1;
      let toast = { text: '', time: 0, color: C.navy };
      let audioContext = null;
      let masterGain = null;
      let musicTimer = null;
      let musicBeat = 0;
      let audioMuted = false;
      let externalAudioUnlocked = false;
      let currentBgmName = null;
      let finishMusicCompleted = false;
      let isPaused = false;
      let lastResult = null;
      let personalBestScore = loadBestScore();

      function playTone(frequency, duration = 0.1, type = 'square', volume = 0.035, delay = 0) {
        if (!audioContext || !masterGain || audioMuted) return;
        const start = audioContext.currentTime + delay;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(gain);
        gain.connect(masterGain);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.03);
      }

      function playNoise(duration = 0.08, volume = 0.025) {
        if (!audioContext || !masterGain || audioMuted) return;
        const length = Math.max(1, Math.floor(audioContext.sampleRate * duration));
        const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i += 1) data[i] = Math.random() * 2 - 1;
        const source = audioContext.createBufferSource();
        const gain = audioContext.createGain();
        gain.gain.setValueAtTime(volume, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
        source.buffer = buffer;
        source.connect(gain);
        gain.connect(masterGain);
        source.start();
      }

      function playSfx(name) {
        if (name === 'tap') playTone(620, 0.06, 'square', 0.025);
        else if (name === 'sew') playTone(310, 0.07, 'square', 0.026);
        else if (name === 'transfer') {
          playTone(480, 0.08, 'triangle', 0.035);
          playTone(640, 0.1, 'triangle', 0.032, 0.08);
        } else if (name === 'jam') {
          playNoise(0.13, 0.03);
          playTone(125, 0.18, 'sawtooth', 0.028);
        } else if (name === 'fix') {
          [440, 660, 880].forEach((note, index) => playTone(note, 0.1, 'square', 0.028, index * 0.07));
        } else if (name === 'complete') {
          [523, 659, 784].forEach((note, index) => playTone(note, 0.13, 'triangle', 0.036, index * 0.08));
        } else if (name === 'wrong') {
          playTone(190, 0.22, 'sawtooth', 0.032);
        } else if (name === 'jump') {
          playTone(420, 0.08, 'square', 0.028);
          playTone(640, 0.1, 'square', 0.024, 0.055);
        } else if (name === 'collect') playTone(920, 0.08, 'triangle', 0.032);
        else if (name === 'fever') {
          [659, 880, 1047, 1319].forEach((note, index) => playTone(note, 0.13, 'square', 0.034, index * 0.07));
        } else if (name === 'hit') {
          playNoise(0.1, 0.034);
          playTone(115, 0.2, 'square', 0.025);
        } else if (name === 'arrival') {
          playTone(392, 0.12, 'triangle', 0.035);
          playTone(523, 0.16, 'triangle', 0.035, 0.1);
        } else if (name === 'handoffOpen') {
          playNoise(0.07, 0.018);
          playTone(392, 0.10, 'triangle', 0.052);
          playTone(587, 0.12, 'triangle', 0.050, 0.09);
          playTone(784, 0.18, 'square', 0.044, 0.18);
        } else if (name === 'handoffTick') {
          playTone(720, 0.045, 'square', 0.030);
        } else if (name === 'handoffCenter') {
          playTone(988, 0.075, 'triangle', 0.050);
          playTone(1319, 0.09, 'triangle', 0.038, 0.045);
        } else if (name === 'perfect') {
          [523, 659, 784, 1047, 1319].forEach((note, index) => playTone(note, 0.15, 'square', 0.052, index * 0.06));
          playNoise(0.07, 0.016);
        } else if (name === 'good') {
          playTone(440, 0.13, 'triangle', 0.050);
          playTone(587, 0.16, 'triangle', 0.048, 0.09);
          playTone(784, 0.18, 'triangle', 0.042, 0.18);
        } else if (name === 'safe') {
          playTone(330, 0.18, 'triangle', 0.044);
          playTone(392, 0.20, 'triangle', 0.038, 0.12);
        }
        else if (name === 'shopClose') {
          playTone(1047, 0.24, 'triangle', 0.042);
          playTone(523, 0.34, 'square', 0.022, 0.08);
          playNoise(0.10, 0.018);
        } else if (name === 'packBag') {
          [440, 554, 659].forEach((note, index) => playTone(note, 0.10, 'triangle', 0.032, index * 0.07));
          playNoise(0.06, 0.010);
        } else if (name === 'skateStart') {
          playNoise(0.20, 0.018);
          [523, 659, 784, 1047].forEach((note, index) => playTone(note, 0.13, 'square', 0.033, index * 0.07));
        }
        else if (name === 'end') {
          [392, 494, 587, 784].forEach((note, index) => playTone(note, 0.42, 'triangle', 0.024, index * 0.06));
        }
      }

      function musicTick() {
        if (!audioContext || audioMuted || !masterGain || isPaused || phase === 'end'
            || (phase === 'delivery' && delivery && delivery.handoffModal)) return;
        const externalTrack = currentBgmName ? externalTracks[currentBgmName] : null;
        if (externalTrack && !externalTrack.failed) return;
        const feverActive = phase === 'delivery' && delivery && delivery.feverTime > 0 && !delivery.handoffModal;
        if (feverActive) {
          const feverLead = [784, 988, 1175, 1319, 1047, 1319, 1568, 1760];
          const first = (musicBeat * 2) % feverLead.length;
          playTone(feverLead[first], 0.075, 'square', 0.018);
          playTone(feverLead[(first + 1) % feverLead.length], 0.075, 'square', 0.018, 0.095);
          playTone(musicBeat % 2 ? 196 : 262, 0.16, 'sawtooth', 0.011);
          playNoise(0.035, musicBeat % 2 ? 0.012 : 0.008);
          musicBeat += 1;
          return;
        }
        const factoryMelody = [262, 330, 392, 330, 294, 349, 440, 349];
        const deliveryMelody = [392, 494, 587, 494, 440, 523, 659, 523];
        const transitionMelody = [523, 659, 784, 1047, 659, 784, 1047, 1319];
        const melody = phase === 'delivery' ? deliveryMelody : phase === 'transition' ? transitionMelody : factoryMelody;
        const beat = musicBeat % melody.length;
        playTone(melody[beat], phase === 'delivery' ? 0.11 : phase === 'transition' ? 0.10 : 0.15, 'square', phase === 'transition' ? 0.017 : 0.012);
        if (beat % 2 === 0) playTone(melody[beat] / 2, 0.18, 'triangle', 0.009);
        musicBeat += 1;
      }

      function safePlayExternalTrack(track) {
        if (!track || track.failed || audioMuted || isPaused || !externalAudioUnlocked) return;
        track.audio.muted = false;
        const playPromise = track.audio.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {
            // 자동재생 제한이나 로딩 지연 시 다음 사용자 입력에서 다시 시도합니다.
          });
        }
      }

      function switchExternalBgm(name, options = {}) {
        const next = externalTracks[name];
        if (!next) return;
        if (currentBgmName === name) {
          if (options.restart) {
            try { next.audio.currentTime = 0; } catch (error) { /* 아직 메타데이터 로딩 중 */ }
          }
          safePlayExternalTrack(next);
          return;
        }

        Object.entries(externalTracks).forEach(([trackName, track]) => {
          track.targetVolume = trackName === name ? AUDIO_VOLUMES[name] : 0;
        });
        currentBgmName = name;
        if (options.restart) {
          try { next.audio.currentTime = 0; } catch (error) { /* 아직 메타데이터 로딩 중 */ }
        }
        safePlayExternalTrack(next);
      }

      function desiredBgmForPhase() {
        if (phase === 'start') return 'main';
        if (phase === 'factory') return 'stage1';
        if (phase === 'transition') return 'transition';
        if (phase === 'delivery') {
          if (delivery && delivery.handoffModal) return null;
          return delivery && delivery.feverTime > 0 ? 'fever' : 'stage2';
        }
        if (phase === 'end') return finishMusicCompleted ? 'main' : 'finish';
        return null;
      }

      function syncExternalBgmForPhase() {
        const desired = desiredBgmForPhase();
        if (!desired || desired === currentBgmName) return;
        const restart = desired === 'transition'
          || desired === 'fever'
          || desired === 'finish'
          || (desired === 'stage1' && factory && factory.elapsed < 0.2)
          || (desired === 'stage2' && delivery && delivery.elapsed < 0.2);
        switchExternalBgm(desired, { restart });
      }

      function updateExternalAudio(dt) {
        const fadeStep = Math.min(1, dt / 0.30);
        Object.entries(externalTracks).forEach(([name, track]) => {
          const target = name === currentBgmName && !audioMuted && !isPaused ? AUDIO_VOLUMES[name] : 0;
          track.targetVolume = target;
          track.audio.muted = audioMuted;
          track.audio.volume += (target - track.audio.volume) * fadeStep;
          if (name !== currentBgmName && track.audio.volume < 0.006 && !track.audio.paused) {
            track.audio.volume = 0;
            track.audio.pause();
          }
        });
      }

      function pauseAllExternalBgm() {
        Object.values(externalTracks).forEach(track => track.audio.pause());
      }

      function resumeCurrentExternalBgm() {
        if (!currentBgmName) syncExternalBgmForPhase();
        safePlayExternalTrack(externalTracks[currentBgmName]);
      }

      function resumeAfterHandoff(modal) {
        const resumeName = delivery && delivery.feverTime > 0 ? 'fever' : (modal.resumeBgm || 'stage2');
        const track = externalTracks[resumeName];
        if (!track) return;
        currentBgmName = resumeName;
        track.audio.volume = 0;
        safePlayExternalTrack(track);
      }

      function ensureAudio() {
        externalAudioUnlocked = true;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass && !audioContext) {
          audioContext = new AudioContextClass();
          masterGain = audioContext.createGain();
          masterGain.gain.value = audioMuted ? 0 : SFX_MASTER_VOLUME;
          masterGain.connect(audioContext.destination);
          musicTimer = window.setInterval(musicTick, 210);
        }
        if (audioContext && audioContext.state === 'suspended') audioContext.resume();
        syncExternalBgmForPhase();
        resumeCurrentExternalBgm();
        if (phase === 'start' && !audioMuted) {
          audioHint.textContent = '♫ 메인 음악 재생 중';
          audioHint.classList.add('playing');
        }
        updateSoundButton();
      }

      function updateSoundButton() {
        if (!externalAudioUnlocked) {
          soundButton.textContent = '♫';
          soundButton.setAttribute('aria-label', '음악 켜기');
          soundButton.setAttribute('aria-pressed', 'false');
          return;
        }
        soundButton.textContent = audioMuted ? '×' : '♫';
        soundButton.setAttribute('aria-label', audioMuted ? '소리 켜기' : '소리 끄기');
        soundButton.setAttribute('aria-pressed', audioMuted ? 'true' : 'false');
      }

      function toggleAudio() {
        const wasLocked = !externalAudioUnlocked;
        ensureAudio();
        if (wasLocked) {
          audioMuted = false;
          if (masterGain) masterGain.gain.value = SFX_MASTER_VOLUME;
          Object.values(externalTracks).forEach(track => { track.audio.muted = false; });
          resumeCurrentExternalBgm();
          updateSoundButton();
          return;
        }
        audioMuted = !audioMuted;
        if (masterGain) masterGain.gain.value = audioMuted ? 0 : SFX_MASTER_VOLUME;
        Object.values(externalTracks).forEach(track => { track.audio.muted = audioMuted; });
        if (audioMuted) pauseAllExternalBgm();
        else {
          resumeCurrentExternalBgm();
          if (phase === 'start') {
            audioHint.textContent = '♫ 메인 음악 재생 중';
            audioHint.classList.add('playing');
          }
        }
        updateSoundButton();
      }

      function makeStation() {
        return {
          state: 'idle',
          progress: 0,
          product: null,
          willJam: false,
          jamAt: 0,
          jammedOnce: false,
          jamStart: 0
        };
      }

      function resetFactory() {
        factory = {
          time: FACTORY_DURATION,
          elapsed: 0,
          score: 0,
          sold: 0,
          donations: 0,
          stock: 0,
          served: 0,
          missed: 0,
          combo: 0,
          bestCombo: 0,
          customer: null,
          customerExit: null,
          customerDelay: 0.45,
          firstCustomer: true,
          lastCustomerDesignIndex: -1,
          workerActionRow: 0,
          workerActionTime: 0,
          wrongOrderTime: 0,
          sew: Array.from({ length: 3 }, makeStation),
          steam: Array.from({ length: 3 }, makeStation),
          pack: Array.from({ length: 3 }, makeStation),
          stockDesigns: []
        };
      }

      function startGame() {
        resetFactory();
        isPaused = false;
        finishMusicCompleted = false;
        lastResult = null;
        primaryButton.classList.remove('tertiary-button');
        bestScoreLine.classList.remove('show', 'new-record');
        restartButton.classList.remove('show');
        shareButton.classList.remove('show');
        shopLink.classList.remove('show');
        hideOverlay();
        phase = 'factory';
        ensureAudio();
        switchExternalBgm('stage1', { restart: true });
        lastTime = performance.now();
        announce('70초 양말 공장을 시작합니다.');
        showToast('빈 재봉틀을 탭하세요!', C.green, 2.2);
        playSfx('complete');
      }

      function showOverlay(title, body, buttonText, handler) {
        startLogo.classList.add('compact');
        overlayTitle.innerHTML = title;
        overlayBody.innerHTML = body;
        primaryButton.textContent = buttonText;
        primaryButton.onclick = handler;
        overlay.classList.add('show');
      }

      function hideOverlay() {
        overlay.classList.remove('show');
      }

      function loadBestScore() {
        try {
          const stored = Number(window.localStorage.getItem(BEST_SCORE_KEY));
          return Number.isFinite(stored) && stored > 0 ? Math.floor(stored) : 0;
        } catch (error) {
          return 0;
        }
      }

      function saveBestScore(value) {
        personalBestScore = Math.max(personalBestScore, Math.floor(value));
        try {
          window.localStorage.setItem(BEST_SCORE_KEY, personalBestScore.toString());
        } catch (error) {
          // 저장이 제한된 브라우저에서도 현재 실행 중에는 기록을 유지합니다.
        }
      }

      function showBestScore(isNewRecord = false) {
        bestScoreLine.textContent = isNewRecord
          ? `NEW RECORD! · 내 최고 점수 ${personalBestScore.toLocaleString()}점`
          : `내 최고 점수 ${personalBestScore.toLocaleString()}점`;
        bestScoreLine.classList.toggle('new-record', isNewRecord);
        bestScoreLine.classList.add('show');
      }

      function pauseGame() {
        if (isPaused || !['factory', 'transition', 'delivery'].includes(phase)) return;
        isPaused = true;
        pauseAllExternalBgm();
        primaryButton.classList.remove('tertiary-button');
        bestScoreLine.classList.remove('show', 'new-record');
        restartButton.textContent = '처음부터 다시 하기';
        restartButton.onclick = startGame;
        restartButton.classList.add('show');
        shareButton.classList.remove('show');
        shopLink.classList.remove('show');
        showOverlay(
          '잠시 쉬는 중',
          '게임 시간과 모든 움직임이 멈췄어요.<br>준비되면 이어서 플레이하세요.',
          '게임 계속하기',
          resumeGame
        );
        announce('게임이 일시정지되었습니다.');
      }

      function resumeGame() {
        isPaused = false;
        restartButton.classList.remove('show');
        hideOverlay();
        ensureAudio();
        resumeCurrentExternalBgm();
        lastTime = performance.now();
        announce('게임을 다시 시작합니다.');
      }

      function announce(text) {
        liveRegion.textContent = text;
      }

      function showToast(text, color = C.navy, seconds = 1.35) {
        toast.text = text;
        toast.time = seconds;
        toast.color = color;
        announce(text);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      function assetReady(key) {
        const image = pixelAssets[key];
        return Boolean(image && image.complete && image.naturalWidth > 0);
      }

      function drawSprite(key, anchorX, anchorY, maxWidth, maxHeight, options = {}) {
        if (!assetReady(key)) return false;
        const image = pixelAssets[key];
        const scale = Math.min(maxWidth / image.naturalWidth, maxHeight / image.naturalHeight);
        const width = image.naturalWidth * scale;
        const height = image.naturalHeight * scale;
        const originX = options.originX ?? 0.5;
        const originY = options.originY ?? 1;
        ctx.save();
        ctx.globalAlpha = options.alpha ?? 1;
        ctx.imageSmoothingEnabled = false;
        if (options.flipX) {
          ctx.translate(anchorX, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(image, -width * originX, anchorY - height * originY, width, height);
        } else {
          ctx.drawImage(image, anchorX - width * originX, anchorY - height * originY, width, height);
        }
        ctx.restore();
        return true;
      }

      function drawSpriteInBox(key, x, y, width, height, alpha = 1) {
        return drawSprite(key, x + width / 2, y + height / 2, width, height, {
          originX: 0.5,
          originY: 0.5,
          alpha
        });
      }

      function designIndexOf(design) {
        return Math.max(0, designs.findIndex(item => item.name === design.name));
      }

      function drawSockAsset(design, x, y, width, height) {
        const keys = ['sock-white-eye', 'sock-booby', 'sock-kingfisher'];
        return drawSpriteInBox(keys[designIndexOf(design)], x, y, width, height);
      }

      function roundRect(x, y, w, h, r, fill, stroke, lineWidth = 2) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineWidth;
          ctx.stroke();
        }
      }

      function text(value, x, y, size, color, align = 'left', weight = 700) {
        ctx.fillStyle = color;
        ctx.font = `${weight} ${size}px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillText(value, x, y);
      }

      function drawProgress(x, y, w, value, color) {
        roundRect(x, y, w, 8, 4, 'rgba(23,52,74,0.16)');
        if (value > 0) roundRect(x, y, w * clamp(value, 0, 1), 8, 4, color);
      }

      function drawSock(x, y, scale, design, flip = false) {
        ctx.save();
        ctx.translate(x, y);
        if (flip) ctx.scale(-1, 1);
        ctx.fillStyle = design.body;
        ctx.strokeStyle = C.dark;
        ctx.lineWidth = Math.max(1.5, scale * 1.5);
        ctx.beginPath();
        ctx.moveTo(-8 * scale, -18 * scale);
        ctx.lineTo(8 * scale, -18 * scale);
        ctx.lineTo(8 * scale, 3 * scale);
        ctx.quadraticCurveTo(9 * scale, 11 * scale, 17 * scale, 12 * scale);
        ctx.lineTo(24 * scale, 12 * scale);
        ctx.quadraticCurveTo(28 * scale, 12 * scale, 28 * scale, 17 * scale);
        ctx.quadraticCurveTo(28 * scale, 22 * scale, 22 * scale, 22 * scale);
        ctx.lineTo(5 * scale, 22 * scale);
        ctx.quadraticCurveTo(-8 * scale, 20 * scale, -8 * scale, 7 * scale);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = design.accent;
        ctx.fillRect(-8 * scale, -18 * scale, 16 * scale, 5 * scale);
        ctx.fillRect(-8 * scale, -10 * scale, 16 * scale, 3 * scale);
        ctx.restore();
      }

      function drawPackage(x, y, scale, design) {
        roundRect(x - 22 * scale, y - 18 * scale, 44 * scale, 36 * scale, 5 * scale, design.body, C.dark, 1.5 * scale);
        ctx.fillStyle = design.accent;
        ctx.fillRect(x - 22 * scale, y - 4 * scale, 44 * scale, 7 * scale);
        text('JJTT', x, y + 10 * scale, 8 * scale, C.dark, 'center', 900);
      }

      function spawnCustomer() {
        let qty;
        if (factory.firstCustomer) {
          qty = 1;
        } else if (factory.elapsed < 24) {
          qty = Math.random() < 0.62 ? 1 : 2;
        } else if (factory.elapsed < 50) {
          qty = Math.random() < 0.5 ? 1 : 2;
        } else {
          qty = Math.random() < 0.35 ? 1 : 2;
        }

        const patienceByQty = [0, 18, 21];
        const latePenalty = factory.elapsed > 58 ? 1.5 : 0;
        const maxPatience = factory.firstCustomer ? 25 : patienceByQty[qty] - latePenalty;
        let designIndex = factory.firstCustomer ? 0 : Math.floor(Math.random() * designs.length);
        if (designIndex === factory.lastCustomerDesignIndex && designs.length > 1) {
          designIndex = (designIndex + 1 + Math.floor(Math.random() * (designs.length - 1))) % designs.length;
        }
        factory.lastCustomerDesignIndex = designIndex;
        factory.customer = {
          qty,
          remaining: qty,
          design: designs[designIndex],
          designIndex,
          patience: maxPatience,
          maxPatience,
          look: factory.served % 4
        };
        factory.firstCustomer = false;
        announce(`손님이 ${designs[designIndex].name} 양말 ${qty}켤레를 주문했습니다.`);
      }

      function showWorkerAction(row, seconds = 0.75) {
        factory.workerActionRow = row;
        factory.workerActionTime = seconds;
      }

      function startSew(index) {
        const s = factory.sew[index];
        if (s.state !== 'idle') return;
        const product = designs[index % designs.length];
        s.state = 'sewing';
        s.progress = 0;
        s.product = product;
        s.willJam = Math.random() < JAM_CHANCE;
        s.jamAt = randomBetween(SEW_TIME * 0.34, SEW_TIME * 0.76);
        s.jammedOnce = false;
        showWorkerAction(1);
        playSfx('sew');
      }

      function preferredEmpty(stations, preferredIndex) {
        if (stations[preferredIndex].state === 'idle') return preferredIndex;
        return stations.findIndex(s => s.state === 'idle');
      }

      function moveSewToSteam(index) {
        const source = factory.sew[index];
        if (source.state !== 'sewDone') return;
        const targetIndex = preferredEmpty(factory.steam, index);
        if (targetIndex < 0) {
          showToast('스팀기가 모두 사용 중이에요!', C.coral);
          return;
        }
        const target = factory.steam[targetIndex];
        target.state = 'steaming';
        target.progress = 0;
        target.product = source.product;
        Object.assign(source, makeStation());
        factory.score += 12;
        showWorkerAction(3, 0.65);
        playSfx('transfer');
      }

      function moveSteamToPack(index) {
        const source = factory.steam[index];
        if (source.state !== 'steamDone') return;
        const targetIndex = preferredEmpty(factory.pack, index);
        if (targetIndex < 0) {
          showToast('포장대가 모두 사용 중이에요!', C.coral);
          return;
        }
        const target = factory.pack[targetIndex];
        target.state = 'packing';
        target.progress = 0;
        target.product = source.product;
        Object.assign(source, makeStation());
        factory.score += 12;
        showWorkerAction(3, 0.65);
        playSfx('transfer');
      }

      function clearJam(index) {
        const s = factory.sew[index];
        if (s.state !== 'jammed') return;
        const reaction = factory.elapsed - s.jamStart;
        s.state = 'sewing';
        s.jammedOnce = true;
        showWorkerAction(2, 0.9);
        playSfx('fix');
        if (reaction <= 1.2) {
          factory.score += 25;
          showToast('빠른 수리! +25', C.green);
        } else {
          showToast('실 걸림 해결!', C.green);
        }
      }

      function serveOne(stockIndex) {
        if (!factory.customer) {
          showToast('손님을 기다려주세요!', C.coral);
          return;
        }
        if (factory.stock <= 0) {
          showToast('완성된 양말이 없어요!', C.coral);
          return;
        }
        if (stockIndex < 0 || stockIndex >= factory.stockDesigns.length) {
          showToast('완성된 낱개 양말을 직접 탭해주세요!', C.coral);
          return;
        }

        const selectedDesign = factory.stockDesigns[stockIndex];
        if (!selectedDesign || selectedDesign.name !== factory.customer.design.name) {
          factory.wrongOrderTime = 0.85;
          factory.customer.wrongTime = 0.85;
          showToast(`앗! 주문은 ${factory.customer.design.name}예요`, C.coral, 1.15);
          announce(`주문과 다른 양말입니다. ${factory.customer.design.name} 양말을 골라주세요.`);
          playSfx('wrong');
          return;
        }

        factory.stock -= 1;
        factory.stockDesigns.splice(stockIndex, 1);
        factory.customer.remaining -= 1;
        factory.sold += 1;
        factory.donations += 1;
        factory.score += 100;
        showWorkerAction(3, 0.75);

        if (factory.customer.remaining <= 0) {
          const speedBonus = Math.round((factory.customer.patience / factory.customer.maxPatience) * 50);
          factory.combo += 1;
          factory.bestCombo = Math.max(factory.bestCombo, factory.combo);
          const comboBonus = Math.min(5, factory.combo) * 20;
          factory.score += speedBonus + comboBonus;
          factory.served += 1;
          showToast(`주문 완료! 콤보 ×${factory.combo}`, C.green, 1.1);
          factory.customerExit = { ...factory.customer, mood: 'happy', time: 0.75 };
          factory.customer = null;
          factory.customerDelay = randomBetween(0.8, 1.35);
          playSfx('complete');
        } else {
          playSfx('tap');
        }
      }

      function finishPackage(station) {
        if (factory.stock >= STOCK_MAX) {
          station.state = 'packDone';
          return;
        }
        factory.stock += 1;
        factory.stockDesigns.push(station.product || designs[0]);
        factory.score += 10;
        Object.assign(station, makeStation());
      }

      function updateFactory(dt) {
        factory.time -= dt;
        factory.elapsed += dt;
        factory.workerActionTime = Math.max(0, factory.workerActionTime - dt);
        factory.wrongOrderTime = Math.max(0, factory.wrongOrderTime - dt);
        if (factory.customerExit) {
          factory.customerExit.time -= dt;
          if (factory.customerExit.time <= 0) factory.customerExit = null;
        }
        if (factory.customer && factory.customer.wrongTime) {
          factory.customer.wrongTime = Math.max(0, factory.customer.wrongTime - dt);
        }

        if (factory.time <= 0) {
          factory.time = 0;
          phase = 'transition';
          transitionLeft = TRANSITION_DURATION;
          transitionScene = -1;
          announce(`1단계 장사가 끝났습니다. ${factory.donations}켤레를 가지고 2단계 기부 배달을 시작합니다.`);
          return;
        }

        if (factory.customer) {
          factory.customer.patience -= dt;
          if (factory.customer.patience <= 0) {
            factory.missed += 1;
            factory.combo = 0;
            factory.score = Math.max(0, factory.score - 100);
            factory.customer = null;
            factory.customerDelay = randomBetween(0.8, 1.3);
            showToast('손님이 기다리다 돌아갔어요', C.coral, 1.25);
          }
        } else {
          factory.customerDelay -= dt;
          if (factory.customerDelay <= 0 && factory.time > 1.5) spawnCustomer();
        }

        factory.sew.forEach(s => {
          if (s.state === 'sewing') {
            s.progress += dt;
            if (s.willJam && !s.jammedOnce && s.progress >= s.jamAt) {
              s.state = 'jammed';
              s.jamStart = factory.elapsed;
              showToast('실이 걸렸어요! 재봉틀을 탭!', C.coral, 1.1);
              playSfx('jam');
            } else if (s.progress >= SEW_TIME) {
              s.progress = SEW_TIME;
              s.state = 'sewDone';
            }
          }
        });

        factory.steam.forEach(s => {
          if (s.state === 'steaming') {
            s.progress += dt;
            if (s.progress >= STEAM_TIME) {
              s.progress = STEAM_TIME;
              s.state = 'steamDone';
            }
          }
        });

        factory.pack.forEach(s => {
          if (s.state === 'packing') {
            s.progress += dt;
            if (s.progress >= PACK_TIME) {
              s.progress = PACK_TIME;
              finishPackage(s);
            }
          } else if (s.state === 'packDone' && factory.stock < STOCK_MAX) {
            finishPackage(s);
          }
        });
      }

      function splitDonationBatches(total) {
        const base = Math.floor(total / 3);
        const remainder = total % 3;
        return [0, 1, 2].map(i => base + (i < remainder ? 1 : 0));
      }

          bestTimingStreak: 0,
          deliveredStops: 0,
          featherCharge: 0,
          feathersCollected: 0,
          feverTime: 0,
          feverCount: 0,

          handoffModal: null,

            { spawnAt: 14.3, worldX: 1970, x: 1970, npc: 'fire', designIndex: 1, label: '소방·구급대', short: '소방·구급', batch: batches[1], done: false, perfect: false, modalStarted: false },
            { spawnAt: 23.0, worldX: 3010, x: 3010, npc: 'senior', designIndex: 2, label: '어르신 복지관', short: '어르신 복지관', batch: batches[2], done: false, perfect: false, modalStarted: false }
          ]
        };

      function startDelivery() {
        resetDelivery();
        phase = 'delivery';
        showToast('탭해서 점프 · 목적지에서는 전달 게이지!', C.green, 2.4);
        playSfx('arrival');
      }

      function activeDeliveryStop() {
        if (!delivery) return null;
        if (delivery.handoffModal) return delivery.handoffModal.stop;
        return delivery.stops.find(stop => !stop.done && delivery.elapsed >= stop.spawnAt && stop.x >= 105 && stop.x <= 285) || null;
      }

      function approachingDeliveryStop() {
        if (!delivery || delivery.handoffModal) return null;
        return delivery.stops.find(stop => (
          !stop.done &&
          !stop.modalStarted &&
          delivery.elapsed >= stop.spawnAt &&
          stop.x > 285 &&
          stop.x <= 500
        )) || null;
      }

      function destinationSafetyActive() {
        return Boolean(delivery.handoffModal) || Boolean(approachingDeliveryStop()) || delivery.routeClearTime > 0;
      }

      function addDeliveryScore(base) {
        const feverMultiplier = delivery.feverTime > 0 ? 2 : 1;
        const points = Math.round(base * delivery.startMultiplier * feverMultiplier);
        delivery.score += points;
        return points;
      }

      function addHeartBurst(x, y, count = 9) {
        for (let i = 0; i < count; i += 1) {
          delivery.hearts.push({
            x: x + randomBetween(-42, 42),
            y: y + randomBetween(-20, 35),
            life: randomBetween(0.7, 1.25),
            vy: randomBetween(-65, -30)
          });
        }
      }

      function startHandoff(stop) {
        if (stop.done || stop.modalStarted || delivery.handoffModal) return;
        stop.modalStarted = true;
        delivery.playerY = 702;
        delivery.playerVY = 0;
        delivery.onGround = true;
        delivery.handoffTime = 3;
        delivery.handoffModal = {
          stop,
          marker: stop.designIndex % 2 === 0 ? 0.12 : 0.88,
          direction: stop.designIndex % 2 === 0 ? 1 : -1,
          time: 1.8,
          tickAt: 1.52,
          inCenter: false,
          resumeBgm: currentBgmName || (delivery.feverTime > 0 ? 'fever' : 'stage2'),
          result: null,
          points: 0,
          resultTime: 0
        };
        pauseAllExternalBgm();
        playSfx('handoffOpen');
      }

      function resolveHandoff(timedOut = false) {
        const modal = delivery.handoffModal;
        if (!modal || modal.result) return;
        const distance = Math.abs(modal.marker - 0.5);
        const result = timedOut ? 'safe' : distance <= 0.075 ? 'perfect' : distance <= 0.19 ? 'good' : 'safe';
        const stop = modal.stop;
        stop.done = true;
        stop.perfect = result === 'perfect';
        delivery.deliveredStops += 1;

        let baseScore = 100;
        if (result === 'perfect') {
          delivery.perfectStops += 1;
          delivery.timingStreak += 1;
          delivery.bestTimingStreak = Math.max(delivery.bestTimingStreak, delivery.timingStreak);
          baseScore = 300 + Math.max(0, delivery.timingStreak - 1) * 70;
          playSfx('perfect');
        } else if (result === 'good') {
          delivery.timingStreak = 0;
          baseScore = 180;
          playSfx('good');
        } else {
          delivery.timingStreak = 0;
          playSfx('safe');
        }

        modal.result = result;
        modal.points = addDeliveryScore(baseScore);
        modal.resultTime = 1.0;
        addHeartBurst(stop.x, 620, result === 'perfect' ? 12 : 8);
      }

      function updateDeliveryHearts(dt) {
        delivery.hearts.forEach(h => {
          h.life -= dt;
          h.y += h.vy * dt;
        });
        delivery.hearts = delivery.hearts.filter(h => h.life > 0);
      }

      function updateHandoff(dt) {
        const modal = delivery.handoffModal;
        if (!modal) return;
        if (!modal.result) {
          modal.marker += modal.direction * dt * 0.92;
          if (modal.marker >= 1) {
            modal.marker = 1;
            modal.direction = -1;
          } else if (modal.marker <= 0) {
            modal.marker = 0;
            modal.direction = 1;
          }
          const inCenter = Math.abs(modal.marker - 0.5) <= 0.083;
          if (inCenter && !modal.inCenter) playSfx('handoffCenter');
          modal.inCenter = inCenter;
          modal.time -= dt;
          if (modal.time <= modal.tickAt && modal.tickAt > 0) {
            playSfx('handoffTick');
            modal.tickAt -= 0.30;
          }
          if (modal.time <= 0) resolveHandoff(true);
        } else {
          modal.resultTime -= dt;
          if (modal.resultTime <= 0) {
            delivery.handoffModal = null;
            delivery.handoffTime = 0.2;
            delivery.routeClearTime = 0.8;
            resumeAfterHandoff(modal);
          }
        }
        updateDeliveryHearts(dt);
      }

      function deliveryTap() {
        if (delivery.handoffModal) {
          if (!delivery.handoffModal.result) resolveHandoff(false);
          return;
        }
        if (delivery.onGround) {
          delivery.playerVY = -650;
          delivery.onGround = false;
          playSfx('jump');
        }
      }

      function updateDelivery(dt) {
        delivery.time -= dt;
        delivery.slowTime = Math.max(0, delivery.slowTime - dt);
        delivery.handoffTime = Math.max(0, delivery.handoffTime - dt);
        delivery.routeClearTime = Math.max(0, delivery.routeClearTime - dt);
        if (delivery.handoffModal) {
          updateHandoff(dt);
          if (delivery.time <= 0 && !delivery.handoffModal.result) resolveHandoff(true);
          return;
        }
        delivery.feverTime = Math.max(0, delivery.feverTime - dt);

        delivery.elapsed += dt;
        const feverActive = delivery.feverTime > 0;
        const worldSpeed = feverActive ? 285 : delivery.slowTime > 0 ? 150 : 235;
        delivery.worldOffset = Math.min(DELIVERY_WORLD_WIDTH - W, delivery.elapsed * DELIVERY_WORLD_SPEED);
        delivery.stops.forEach(stop => {
          stop.x = stop.worldX - delivery.worldOffset;
          if (delivery.elapsed >= stop.spawnAt && !stop.done && !stop.modalStarted && stop.x <= 230 && stop.x >= 150) {
            startHandoff(stop);
          }
        });
        const safetyActive = destinationSafetyActive();

        delivery.playerVY += 1550 * dt;
        delivery.playerY += delivery.playerVY * dt;
        if (delivery.playerY >= 702) {
          delivery.playerY = 702;
          delivery.playerVY = 0;
          delivery.onGround = true;
        }

        delivery.obstacles.forEach(o => {
          if (delivery.elapsed < o.spawnAt) return;
          o.x -= (safetyActive ? 430 : worldSpeed) * dt;
          if (safetyActive) return;
          const playerBottom = delivery.playerY + 62;
          const halfWidth = o.type === 'widePuddle' ? 58 : o.type === 'doubleCone' ? 44 : 27;
          const heightLine = o.type === 'ball' ? 735 : o.type === 'doubleCone' ? 741 : 750;
          const colliding = !o.hit && Math.abs(o.x - 112) < halfWidth + 27 && playerBottom > heightLine;
          if (colliding) {
            o.hit = true;
            if (feverActive) {
              const points = addDeliveryScore(60);
              showToast(`피버 돌파! +${points}`, C.yellow, 0.75);
              playSfx('collect');
            } else {
              delivery.slowTime = 1.1;
              delivery.score = Math.max(0, delivery.score - 50);
              showToast('괜찮아요! 다시 달려요', C.coral, 1.0);
              playSfx('hit');
            }
          }
        });

        const deliveryFocusActive = Boolean(activeDeliveryStop()) || safetyActive;
        if (!deliveryFocusActive) {
          delivery.feathers.forEach(feather => {
            if (delivery.elapsed < feather.spawnAt || feather.collected) return;
            feather.x -= worldSpeed * dt;
            const closeX = Math.abs(feather.x - 112) < 42;
            const closeY = feather.y >= delivery.playerY - 48 && feather.y <= delivery.playerY + 70;
            if (closeX && closeY) {
              feather.collected = true;
              delivery.feathersCollected += 1;
              delivery.featherCharge += 1;
              addDeliveryScore(40);
              playSfx('collect');
              if (delivery.featherCharge >= 5) {
                delivery.featherCharge = 0;
                delivery.feverTime = 4;
                delivery.feverCount += 1;
                showToast('GOOD THINGS FEVER! 4초', C.yellow, 1.35);
                playSfx('fever');
              }
            }
          });
        } else {
          delivery.feathers.forEach(feather => {
            if (delivery.elapsed < feather.spawnAt || feather.collected) return;
            feather.x -= 430 * dt;
          });
        }

        delivery.stops.forEach(stop => {
          if (delivery.elapsed < stop.spawnAt) return;
          if (!stop.done && stop.x < 48) {
            stop.done = true;
            delivery.deliveredStops += 1;
            delivery.timingStreak = 0;
            showToast(`${stop.short} 안전 배달 완료`, C.navy, 1.0);
            playSfx('safe');
          }
        });

        updateDeliveryHearts(dt);

        if (delivery.time <= 0) {
          delivery.time = 0;
          phase = 'end';
          playSfx('end');
          showFinal();
        }
      }

      async function copyShareText(value) {
        if (window.navigator.clipboard && window.isSecureContext) {
          await window.navigator.clipboard.writeText(value);
          return;
        }
        const textarea = document.createElement('textarea');
        textarea.value = value;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
      }

      async function shareScore() {
        const shareText = scoreShareText();
        if (!shareText) return;
        const shareData = { title: 'JJTT 양말가게 타이쿤', text: shareText };
        if (window.location && /^https?:$/.test(window.location.protocol)) shareData.url = window.location.href;

        try {
          const receiptFile = window.navigator.canShare ? await createReceiptShareFile() : null;
          if (receiptFile) shareData.files = [receiptFile];
          if (window.navigator.share) {
            await window.navigator.share(shareData);
            shareButton.textContent = '공유 완료!';
          } else {
            await copyShareText([shareText, shareData.url].filter(Boolean).join(' '));
            shareButton.textContent = '점수가 복사됐어요!';
          }
          setTimeout(() => { shareButton.textContent = '내 결과 공유하기'; }, 1600);
        } catch (error) {
          if (error && error.name === 'AbortError') return;
          try {
            await copyShareText(shareText);
            shareButton.textContent = '점수가 복사됐어요!';
            setTimeout(() => { shareButton.textContent = '내 결과 공유하기'; }, 1600);
          } catch (copyError) {
            shareButton.textContent = '공유를 다시 시도해주세요';
          }
        }
      }

      function handleFactoryTap(x, y) {
        if (y >= stockRect.y && y <= stockRect.y + stockRect.h && x >= stockRect.x && x <= stockRect.x + stockRect.w) {
          const firstSlotX = 33;
          const slotWidth = 52;
          const stockIndex = y >= 746 && y <= 818 && x >= firstSlotX
            ? Math.floor((x - firstSlotX) / slotWidth)
            : -1;
          serveOne(stockIndex);
          return;
        }

        for (let row = 0; row < 3; row += 1) {
          const cellY = stationRows[row];
          if (y < cellY || y > cellY + stationH) continue;

          if (x >= stationColumns[0] && x <= stationColumns[0] + stationW) {
            const s = factory.sew[row];
            if (s.state === 'idle') startSew(row);
            else if (s.state === 'jammed') clearJam(row);
            else if (s.state === 'sewDone') moveSewToSteam(row);
            return;
          }

          if (x >= stationColumns[1] && x <= stationColumns[1] + stationW) {
            if (factory.steam[row].state === 'steamDone') moveSteamToPack(row);
            return;
          }

          if (x >= stationColumns[2] && x <= stationColumns[2] + stationW) {
            if (factory.pack[row].state === 'packDone') showToast('진열대를 먼저 비워주세요!', C.coral);
            return;
          }
        }
      }

      function pointerPosition(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * (W / rect.width),
          y: (event.clientY - rect.top) * (H / rect.height)
        };
      }

      canvas.addEventListener('pointerdown', event => {
        event.preventDefault();
        const p = pointerPosition(event);
        if (phase === 'factory') handleFactoryTap(p.x, p.y);
        else if (phase === 'delivery') deliveryTap();
      });

      window.addEventListener('keydown', event => {
        if (event.code === 'Escape' && ['factory', 'transition', 'delivery'].includes(phase)) {
          event.preventDefault();
          if (isPaused) resumeGame();

          return;
        }
        if (event.code === 'Space' && phase === 'delivery') {

        text(Math.ceil(delivery.time).toString().padStart(2, '0'), W / 2, 61, 26, C.yellow, 'center', 900);
        text('기부', 505, 30, 13, C.cream, 'right', 900);
        text(`${factory.donations}켤레`, 505, 60, 21, C.yellow, 'right', 900);

        const progress = 1 - delivery.time / DELIVERY_DURATION;
        roundRect(16, 101, 508, 14, 7, 'rgba(41,79,100,0.25)');
        roundRect(16, 101, 508 * progress, 14, 7, C.coral);

        text('깃털', 19, 137, 13, C.navy, 'left', 900);
        for (let i = 0; i < 5; i += 1) {
          ctx.beginPath();
          ctx.arc(87 + i * 22, 133, 7, 0, Math.PI * 2);
          ctx.fillStyle = i < delivery.featherCharge ? C.yellow : 'rgba(41,79,100,0.18)';
          ctx.fill();
          ctx.strokeStyle = C.navy;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        if (delivery.feverTime > 0) {
          roundRect(316, 121, 208, 25, 12, C.yellow, C.navy, 2);
          text(`FEVER ${delivery.feverTime.toFixed(1)}s`, 420, 134, 14, C.navy, 'center', 900);
        } else {
          text(`수집 ${delivery.feathersCollected}개`, 521, 136, 13, C.navy, 'right', 900);
        }
      }

      function drawSkater() {
        const x = 112;
        const y = delivery.playerY;
        const state = delivery.handoffModal || delivery.handoffTime > 0 ? 'handoff' : delivery.slowTime > 0 ? 'wobble' : delivery.onGround ? 'ride' : 'jump';
        const frame = Math.floor(delivery.elapsed * 6) % 2 ? 'b' : 'a';
        const spriteKey = `cj-delivery-${state}-${frame}`;
        if (assetReady(spriteKey)) {
          const alpha = delivery.slowTime > 0 ? 0.62 + Math.sin(performance.now() / 70) * 0.2 : 1;
          if (delivery.feverTime > 0) {
            drawSprite('effect-speed', 115, y + 38, 180, 72, { alpha: 0.62, originX: 0.5, originY: 0.5 });
          }
          drawSprite(spriteKey, x, y + 100, 190, 188, { alpha, flipX: true });
          if (delivery.feverTime > 0) {
            const birdY = y - 55 + Math.sin(delivery.elapsed * 10) * 7;
            drawSprite('booby-bird', 47, birdY + 20, 70, 62);
          }
          return;
        }
        ctx.save();
        if (delivery.slowTime > 0) ctx.globalAlpha = 0.62 + Math.sin(performance.now() / 70) * 0.2;

        ctx.fillStyle = C.dark;
        ctx.fillRect(x - 34, y + 58, 78, 8);
        ctx.beginPath();
        ctx.arc(x - 22, y + 70, 8, 0, Math.PI * 2);
        ctx.arc(x + 32, y + 70, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = C.yellow;
        ctx.fillRect(x - 18, y + 6, 40, 47);
        ctx.fillStyle = C.coral;
        ctx.fillRect(x - 27, y - 7, 54, 16);
        ctx.fillStyle = C.cream;
        ctx.beginPath();
        ctx.arc(x, y - 6, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = C.dark;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = C.navy;
        ctx.fillRect(x - 26, y - 28, 53, 12);
        ctx.fillRect(x + 18, y - 19, 17, 6);
        ctx.fillStyle = C.dark;
        ctx.fillRect(x + 7, y - 9, 4, 4);

        ctx.fillStyle = C.green;
        ctx.fillRect(x - 39, y + 7, 23, 33);
        text('🧦', x - 28, y + 24, 14, C.white, 'center', 800);

        if (delivery.feverTime > 0) {
          const birdY = y - 45 + Math.sin(delivery.elapsed * 10) * 7;
          ctx.fillStyle = C.yellow;
          ctx.beginPath();
          ctx.ellipse(x - 55, birdY, 16, 11, -0.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = C.navy;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x - 58, birdY);
          ctx.quadraticCurveTo(x - 75, birdY - 20, x - 83, birdY - 4);
          ctx.stroke();
          ctx.fillStyle = C.coral;
          ctx.beginPath();
          ctx.moveTo(x - 39, birdY - 2);
          ctx.lineTo(x - 29, birdY + 2);
          ctx.lineTo(x - 40, birdY + 5);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function drawObstacle(o) {
        if (delivery.elapsed < o.spawnAt || o.x < -80 || o.x > W + 80) return;
        const assetKey = o.type === 'widePuddle' ? 'obstacle-puddle' : o.type === 'doubleCone' ? 'obstacle-cones' : 'obstacle-ball';
        if (assetReady(assetKey)) {
          const alpha = o.hit ? 0.35 : 1;
          if (o.type === 'widePuddle') drawSprite(assetKey, o.x, 796, 132, 54, { alpha });
          else if (o.type === 'doubleCone') drawSprite(assetKey, o.x, 801, 104, 87, { alpha });
          else drawSprite(assetKey, o.x, 798, 72, 72, { alpha });
          return;
        }
        ctx.globalAlpha = o.hit ? 0.35 : 1;
        if (o.type === 'widePuddle') {
          ctx.fillStyle = '#4f94b3';
          ctx.beginPath();
          ctx.ellipse(o.x, 775, 59, 12, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = C.white;
          ctx.fillRect(o.x - 30, 769, 24, 3);
          ctx.fillRect(o.x + 13, 774, 20, 3);
        } else if (o.type === 'doubleCone') {
          [-22, 22].forEach((offset, index) => {
            ctx.fillStyle = index === 0 ? C.coral : C.yellow;
            ctx.beginPath();
            ctx.moveTo(o.x + offset, 727 + index * 5);
            ctx.lineTo(o.x + offset - 19, 771);
            ctx.lineTo(o.x + offset + 19, 771);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = C.cream;
            ctx.fillRect(o.x + offset - 12, 750 + index * 3, 24, 7);
          });
        } else {
          ctx.save();
          ctx.translate(o.x, 746);
          ctx.rotate(delivery.elapsed * 7);
          ctx.fillStyle = C.coral;
          ctx.beginPath();
          ctx.arc(0, 0, 25, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = C.cream;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(0, 0, 15, 0.3, 2.6);
          ctx.stroke();
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      }

      function drawFeather(feather) {
        if (delivery.elapsed < feather.spawnAt || feather.collected || feather.x < -45 || feather.x > W + 55) return;
        const bob = Math.sin(delivery.elapsed * 7 + feather.spawnAt) * 6;
        const featherKey = Math.floor(delivery.elapsed * 7) % 2 ? 'feather-b' : 'feather-a';
        if (assetReady(featherKey)) {
          drawSprite(featherKey, feather.x, feather.y + bob, 54, 68, { originX: 0.5, originY: 0.5 });
          return;
        }
        ctx.save();
        ctx.translate(feather.x, feather.y + bob);
        ctx.rotate(-0.38 + Math.sin(delivery.elapsed * 4) * 0.14);
        ctx.fillStyle = C.yellow;
        ctx.strokeStyle = C.navy;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-3, 18);
        ctx.bezierCurveTo(-22, 5, -18, -20, 9, -25);
        ctx.bezierCurveTo(20, -8, 15, 8, -3, 18);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-7, 22);
        ctx.lineTo(9, -21);
        ctx.stroke();
        ctx.restore();
      }

      function drawDeliveryStop(stop) {
        if (stop.x < -130 || stop.x > W + 130) return;
        const approaching = delivery.elapsed >= stop.spawnAt && !stop.done && !stop.modalStarted && stop.x > 285 && stop.x <= 500;
        const inZone = delivery.elapsed >= stop.spawnAt && !stop.done && stop.x >= 105 && stop.x <= 285;
        if (approaching) {
          ctx.fillStyle = 'rgba(217,231,206,0.24)';
          ctx.fillRect(285, 228, 215, 580);
          roundRect(100, 158, 340, 54, 15, C.paleGreen, C.green, 3);
          text('기부처 접근 중 · 안전 구역', W / 2, 185, 14, C.green, 'center', 900);
        }
        if (inZone) {
          ctx.fillStyle = 'rgba(241,202,98,0.24)';
          ctx.fillRect(105, 228, 180, 580);
          roundRect(90, 158, 360, 54, 15, C.cream, C.navy, 3);
          text('목적지 도착 · 전달 준비!', W / 2, 185, 14, C.green, 'center', 900);
        }

        const x = stop.x;
        roundRect(x - 78, 510, 156, 42, 12, C.white, C.navy, 2);
        text(stop.short, x, 531, 14, C.navy, 'center', 900);

        const npcState = stop.done ? 'receive' : 'wait';
        drawSprite(`npc-${stop.npc}-${npcState}`, x, 710, 116, 146);

        if (!stop.done) {
          roundRect(x + 45, 555, 68, 98, 16, C.white, C.navy, 2);
          drawSockAsset(designs[stop.designIndex], x + 59, 563, 40, 53);
          roundRect(x + 52, 620, 54, 25, 12, C.navy);
          text(`${stop.batch}켤레`, x + 79, 633, 12, C.yellow, 'center', 900);
        } else {
          roundRect(x + 42, 586, 84, 32, 15, C.paleGreen, C.green, 2);
          text('전달 완료!', x + 84, 602, 12, C.green, 'center', 900);
        }
      }

      function drawDeliveryHearts() {
        delivery.hearts.forEach(h => {
          const alpha = clamp(h.life, 0, 1);
          if (!drawSprite('effect-heart', h.x, h.y, 36, 36, { alpha, originX: 0.5, originY: 0.5 })) {
            ctx.globalAlpha = alpha;
            text('♥', h.x, h.y, 24, C.coral, 'center', 900);
          }
        });
        ctx.globalAlpha = 1;
      }

      function drawFeverFlash() {
        if (delivery.feverTime <= 0 || delivery.handoffModal) return;
        const pulse = Math.pow((Math.sin(delivery.elapsed * Math.PI * 5) + 1) / 2, 8);
        const flashAlpha = 0.035 + pulse * 0.115;
        ctx.fillStyle = `rgba(255,244,174,${flashAlpha})`;
        ctx.fillRect(0, 0, W, H);

        const edgeAlpha = 0.14 + pulse * 0.30;
        ctx.fillStyle = `rgba(241,202,98,${edgeAlpha})`;
        ctx.fillRect(0, 0, W, 8);
        ctx.fillRect(0, H - 8, W, 8);
        ctx.fillStyle = `rgba(143,190,209,${edgeAlpha})`;
        ctx.fillRect(0, 0, 8, H);
        ctx.fillRect(W - 8, 0, 8, H);
      }

      function drawHandoffModal() {
        const modal = delivery.handoffModal;
        if (!modal) return;
        const stop = modal.stop;
        ctx.fillStyle = 'rgba(23,52,74,0.70)';
        ctx.fillRect(0, 0, W, H);
        roundRect(40, 205, 460, 526, 24, C.cream, C.navy, 4);

        text('GOOD THINGS HANDOFF', W / 2, 234, 14, C.coral, 'center', 900);
        text(stop.label, W / 2, 266, 20, C.navy, 'center', 900);
        roundRect(84, 286, 372, 174, 18, C.paleSky, C.navy, 3);
        const npcState = modal.result ? 'receive' : 'wait';
        drawSprite('cj-delivery-handoff-a', 145, 442, 166, 160, { flipX: true });
        drawSprite(`npc-${stop.npc}-${npcState}`, 395, 442, 116, 145);
        drawSockAsset(designs[stop.designIndex], 245, 326, 50, 74);
        roundRect(236, 405, 68, 28, 14, C.navy);
        text(`${stop.batch}켤레`, 270, 419, 13, C.yellow, 'center', 900);

        const barX = 82;
        const barY = 505;
        const barW = 376;
        roundRect(barX, barY, barW, 38, 19, C.paleCoral, C.navy, 3);
        ctx.fillStyle = C.yellow;
        ctx.fillRect(barX + 62, barY + 3, barW - 124, 32);
        ctx.fillStyle = C.green;
        ctx.fillRect(barX + 157, barY + 3, 62, 32);
        const markerX = barX + modal.marker * barW;
        ctx.fillStyle = C.white;
        ctx.beginPath();
        ctx.moveTo(markerX, barY - 12);
        ctx.lineTo(markerX - 11, barY + 3);
        ctx.lineTo(markerX + 11, barY + 3);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = C.navy;
        ctx.lineWidth = 3;
        ctx.stroke();

        if (!modal.result) {
          text('가운데 초록 칸에서 탭!', W / 2, 580, 19, C.green, 'center', 900);
          text(`남은 시간 ${Math.max(0, modal.time).toFixed(1)}초`, W / 2, 616, 13, C.navy, 'center', 800);
          roundRect(114, 651, 312, 48, 15, C.navy);
          text('화면 어디든 탭', W / 2, 675, 15, C.cream, 'center', 900);
        } else {
          const resultLabel = modal.result === 'perfect' ? 'PERFECT!' : modal.result === 'good' ? 'GOOD!' : 'SAFE!';
          const resultColor = modal.result === 'perfect' ? C.green : modal.result === 'good' ? C.navy : C.coral;
          text(resultLabel, W / 2, 584, 30, resultColor, 'center', 900);
          text(`+${modal.points.toLocaleString()} · 전달 완료`, W / 2, 626, 15, C.navy, 'center', 900);
          text('잠시 후 다시 출발해요!', W / 2, 675, 14, C.green, 'center', 800);
        }
      }

      function drawDeliveryFooter() {
        roundRect(18, 884, 504, 56, 14, C.navy);
        const stop = activeDeliveryStop();
        const approaching = approachingDeliveryStop();
        const label = delivery.handoffModal
          ? '게이지 중앙을 맞춰 양말을 전달하세요!'
          : stop
            ? '기부처에 도착하면 잠시 멈춰요!'
          : approaching
            ? '기부처 안전 구역 · 깃털과 장애물 충돌 없음'
          : delivery.feverTime > 0
            ? 'FEVER! 충돌 면역 · 점수 2배'
            : '탭해서 점프 · 깃털 5개면 피버';
        text(label, W / 2, 912, 15, stop || approaching ? C.yellow : C.cream, 'center', 900);
      }

      function drawDelivery() {
        drawDeliveryBackground();
        drawDeliveryHUD();
        delivery.stops.forEach(drawDeliveryStop);
        if (!activeDeliveryStop()) delivery.feathers.forEach(drawFeather);
        delivery.obstacles.forEach(drawObstacle);
        drawSkater();
        drawDeliveryHearts();
        drawDeliveryFooter();
        drawFeverFlash();
        drawToast();
        drawHandoffModal();
      }

      function updateTransition(dt) {
        transitionLeft = Math.max(0, transitionLeft - dt);
        const nextScene = transitionSceneFor(transitionLeft);
        if (nextScene !== transitionScene) {
          transitionScene = nextScene;
          playSfx(nextScene === 0 ? 'shopClose' : nextScene === 1 ? 'packBag' : 'skateStart');
          announce(nextScene === 0
            ? '1단계 장사 끝. 게임은 계속됩니다.'
            : nextScene === 1
              ? '기부 양말을 세 기부처별로 가방에 담습니다.'
              : '2단계 기부 배달을 시작합니다.');
        }
        if (transitionLeft <= 0) startDelivery();
      }

      function update(dt) {
        if (isPaused) return;
        if (toast.time > 0) toast.time = Math.max(0, toast.time - dt);

        if (phase === 'factory') updateFactory(dt);
        else if (phase === 'transition') updateTransition(dt);
        else if (phase === 'delivery') updateDelivery(dt);
        syncExternalBgmForPhase();
        updateExternalAudio(dt);
      }

      function draw() {
        if (phase === 'factory') drawFactory();
        else if (phase === 'transition') drawTransition();
        else if (phase === 'delivery' || phase === 'end') drawDelivery();
        else {
          resetFactory();
          drawFactory();
        }
      }

      function loop(timestamp) {
        const rawDt = lastTime ? (timestamp - lastTime) / 1000 : 0;
        const dt = Math.min(0.05, Math.max(0, rawDt));
        lastTime = timestamp;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      primaryButton.onclick = startGame;
      soundButton.onclick = toggleAudio;
      pauseButton.onclick = pauseGame;
      shareButton.onclick = shareScore;
      overlay.addEventListener('pointerdown', event => {
        if (phase !== 'start' || externalAudioUnlocked || event.target.closest('button, a')) return;
        ensureAudio();
      });
      updateSoundButton();

      ctx.imageSmoothingEnabled = false;
      resetFactory();
      showBestScore(false);
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
